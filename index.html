<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji AI Chat</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .ai-message {
            align-self: flex-start;
            background-color: #e2e2e2;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        #input-area {
            display: flex;
            padding: 10px 20px;
            background-color: #fff;
            border-top: 1px solid #ddd;
        }
        #user-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            margin-right: 10px;
            font-size: 1em;
        }
        #send-button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
        }
        #send-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-button">Send</button>
    </div>

    <script type="module">
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        let conversationHistory = [];

        function displayMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            if (sender === 'user') {
                messageDiv.classList.add('user-message');
            } else {
                messageDiv.classList.add('ai-message');
            }
            messageDiv.textContent = message;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Auto-scroll to bottom
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            displayMessage(message, 'user');
            userInput.value = '';
            sendButton.disabled = true; // Disable button while AI is thinking

            try {
                const newMessage = {
                    role: "user",
                    content: message,
                };
                conversationHistory.push(newMessage);
                
                // Only send the last few messages to keep context relevant but not too long
                conversationHistory = conversationHistory.slice(-5); 

                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: `You are an AI that responds ONLY with emojis. Do not use any text, just emojis. Interpret the user's message and convey your response using a sequence of emojis. Aim for 3-10 emojis per response.`,
                        },
                        ...conversationHistory,
                    ],
                });

                const aiResponse = completion.content;
                displayMessage(aiResponse, 'ai');
                conversationHistory.push({ role: "assistant", content: aiResponse });

            } catch (error) {
                console.error("Error communicating with AI:", error);
                displayMessage("🤖 An error occurred. Please try again.", 'ai');
            } finally {
                sendButton.disabled = false; // Re-enable button
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
        
        displayMessage("👋🤖 Hello! I respond only with emojis. Try me!", 'ai');
    </script>

</body>
</html>
